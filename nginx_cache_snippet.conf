# Add this inside your NGINX server { } block to enable expires headers for static files and images
location /static/ {
    alias /path/to/your/Rawwish/static/;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /media/ {
    alias /path/to/your/Rawwish/media/;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
